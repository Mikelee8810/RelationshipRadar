name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build, unit test, and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

# This is the minimum automated gate, not the production-readiness gate.
# Add instrumented/UI, screenshot/golden, and release-mode performance checks
# as those suites are implemented. See docs/production-quality-gate.md.
